name: 终极全自动同步 (代码+Releases)

on:
  workflow_dispatch: # 支持手动点击
  schedule:
    - cron: '47 16 * * *' # 每天北京时间 0:47 自动运行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 第一步：自动同步原作者的代码（相当于帮你自动点了 Sync fork）
      - name: 同步上游代码
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: kingcharleslzy-ai/dsh-purge # 记得改成你对应的上游
          upstream_sync_branch: master
          target_sync_branch: master
          target_repo_token: ${{ secrets.GH_TOKEN }}
          
      # 第二步：自动搬运 Releases 和附件
      - name: 搬运 Releases
        uses: andrewthetechie/gha-clone-releases@v1
        with:
          token: ${{ secrets.GH_TOKEN }}
          src_repo: 555bbbAAA/dsh-purge # 记得改成你对应的上游
          copy_assets: true
