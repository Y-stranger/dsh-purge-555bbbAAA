name: Clone Releases # 工作流的名称，可以随便改，比如“同步满血版”
on:
  workflow_dispatch: # 允许你在网页上手动点击“运行工作流”来立刻触发
  schedule:
    - cron: '20 16 * * *' # 定时任务：每天 UTC 时间 16:20（北京时间凌晨 0:20）自动运行

jobs:
  clone:
    runs-on: ubuntu-latest # 使用 GitHub 提供的最新版云端 Linux 服务器运行
    steps:
      - name: Clone Releases # 这一步的名字叫“克隆发行版”
        uses: andrewthetechie/gha-clone-releases@v1 # 使用第三方写好的搬运工具（版本v1）
        with:
          token: ${{ secrets.GH_TOKEN }} # 使用你刚才在仓库设置里添加的机密令牌，用于授权上传
          src_repo: 555bbbAAA/dsh-purge # 目标上游仓库（原作者账号/仓库名）
          copy_assets: true # 是否同时搬运附件（比如编译好的ZIP包），true代表是
